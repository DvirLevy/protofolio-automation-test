name: Publish Playwright Report to Pages

on:
  workflow_run:
    workflows:
      - Run Portfolio Regression Tests
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy report to GitHub Pages
        uses: actions/deploy-pages@v4
