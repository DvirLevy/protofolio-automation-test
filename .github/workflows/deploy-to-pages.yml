name: Publish Playwright Report to Pages

on:
  workflow_run:
    workflows:
      - Run Portfolio Regression Tests
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact from workflow run # i'm downloading the report artifact because it was uploaded in other workflow (regression.yml)
        uses: dawidd6/action-download-artifact@v3
        with:
          name: github-pages
          path: playwright-report
      
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

      - name: Deploy report to GitHub Pages
        uses: actions/deploy-pages@v4
