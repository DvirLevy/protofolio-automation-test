name: Notify by Email After Regression

on:
  workflow_run:
    workflows:
      - Run Portfolio Regression Tests
    types:
      - completed

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Download user email artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: user-email
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Read user email
        id: read_email
        env:
          ADMIN_EMAIL: ${{ secrets.GMAIL_USER }}
        run: |
          if [ -f user_email.txt ]; then
            USER_EMAIL_VAL=$(cat user_email.txt)
            if [ -n "$USER_EMAIL_VAL" ]; then
              echo "TO_EMAILS=${ADMIN_EMAIL},${USER_EMAIL_VAL}" >> $GITHUB_ENV
            else
              echo "TO_EMAILS=${ADMIN_EMAIL}" >> $GITHUB_ENV
            fi
          else
            echo "TO_EMAILS=${ADMIN_EMAIL}" >> $GITHUB_ENV
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          subject: >
            ${{ github.event.workflow_run.conclusion == 'success' && '✅' || '❌' }}
            Portfolio E2E – Run #${{ github.event.workflow_run.id }}

          body: |
            Portfolio regression execution finished.

            Status:
            ${{ github.event.workflow_run.conclusion }}

            🔗 Live Playwright Report:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?${{ github.event.workflow_run.id }}

            🧪 Test Run ID:
            ${{ github.event.workflow_run.id }}

            🔍 GitHub Actions Logs:
            ${{ github.event.workflow_run.html_url }}

          to: ${{ env.TO_EMAILS }}
          from: Portfolio CI <${{ secrets.GMAIL_USER }}>

