name: Playwright Tests
on:
  push:
    branches: [ ]
  pull_request:
    branches: [  ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: prod

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Debug - Check environment variables
      run: |
        echo "CI: $CI"
        echo "HOST: $HOST"
        echo "LINKEDIN_URL: $LINKEDIN_URL"
        echo "All env vars:"
        HOST: ${{ secrets.HOST }}
        LINKEDIN_URL: ${{ secrets.LINKEDIN_URL }}
        printenv | grep -E 'HOST|LINKEDIN|CI' || true

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        CI: true
      run: npm run prod
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
